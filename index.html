    <!-- Áp theme NGAY khi trang bắt đầu render (trước khi tải CSS/JS) để không bị nháy nền trắng
         khi người dùng đang dùng giao diện tối. Logic phải khớp với src/lib/theme.js. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          if (stored !== 'light' && stored !== 'dark') stored = 'system'
          var dark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var css = localStorage.getItem('themeCss')
          if (css) { var st = document.createElement('style'); st.id = 'md-theme-override'; st.textContent = css; document.head.appendChild(st) }
          var root = document.documentElement
          if (dark) root.classList.add('dark')
          var scale = localStorage.getItem('fontScale')
          if (scale === '0.9' || scale === '1' || scale === '1.15') root.style.setProperty('--font-scale', scale)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#111318' : '#F9F9FF')
        } catch (e) {}
      })()
    </script>

    <!-- CSS tối thiểu, inline: nền + màn hình khởi động hiển thị đúng theme trước cả khi file CSS chính tải xong. -->
    <style>
      html { background: rgb(var(--md-surface, 249 249 255)); color-scheme: light; }
      html.dark { background: rgb(var(--md-surface, 17 19 24)); color-scheme: dark; }
      body { margin: 0; }
      .boot {
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
      }
      .boot img { width: 64px; height: 64px; border-radius: 20px; animation: boot-pulse 1.4s ease-in-out infinite; }
      .boot i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--md-primary, 65 95 145)); margin: 0 3px; animation: boot-bounce 1s infinite ease-in-out both; }
      html.dark .boot i { background: rgb(var(--md-primary, 170 199 255)); }
      .boot i:nth-child(1) { animation-delay: -0.3s; }
      .boot i:nth-child(2) { animation-delay: -0.15s; }
      @keyframes boot-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .75; transform: scale(.96); } }
      @keyframes boot-bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
    </style>
  </head>
  <body class="bg-surface text-on-surface font-sans antialiased">
    <!-- Màn hình khởi động tĩnh: hiện ngay lập tức, React sẽ thay thế khi mount. -->
